<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="48天冲刺">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.json">
<title>48天冲刺 · 数一/英一/408</title>
<style>
:root{
  /* 背景与表面 */
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f2f4f7; --line:#e8eaee; --line-2:#dfe3e9;
  /* 文字 */
  --tx:#111827; --tx-2:#4b5563; --tx-3:#9ca3af;
  /* 主色与科目色（浅底 + 深字） */
  --blue:#2563eb; --blue-ink:#1d4ed8; --blue-wash:#eff4ff;
  --math:#2563eb; --math-wash:#eff4ff;
  --en:#059669; --en-wash:#ecfdf5;
  --cs:#d97706; --cs-wash:#fff7ed;
  --rev:#7c3aed; --rev-wash:#f5f3ff;
  --red:#dc2626; --red-wash:#fef2f2;
  /* 形状 */
  --r:16px; --r-sm:12px; --gap:12px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px -10px rgba(16,24,40,.10);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--bg);color-scheme:light}
input,textarea,select{-webkit-appearance:none;appearance:none;font-size:16px;font-family:inherit}
input[type="date"]{min-height:40px}
body{
  background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-bottom:calc(76px + var(--safe-b));overflow-x:hidden;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--blue)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{padding:22px 0 4px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-size:13px;letter-spacing:.01em;color:var(--tx-3);font-weight:500}
.brand b{color:var(--tx);font-weight:700;letter-spacing:-.01em}
.settingsBtn{font-size:12.5px;color:var(--tx-2);border:1px solid var(--line-2);border-radius:999px;padding:5px 11px;background:var(--surface)}
.hero{display:flex;align-items:flex-end;gap:16px;margin-top:14px}
.count{display:flex;align-items:baseline;gap:6px}
.count .num{font-family:var(--mono);font-size:60px;line-height:.9;font-weight:700;letter-spacing:-.045em;color:var(--tx)}
.count .unit{font-size:14px;color:var(--tx-3);font-weight:500}
.heroMeta{flex:1;min-width:0;padding-bottom:6px}
.heroMeta .l1{font-size:13px;color:var(--tx-2);font-weight:500}
.heroMeta .l2{font-size:12px;color:var(--tx-3);margin-top:2px}
.dbar{height:6px;border-radius:99px;background:#eceef2;margin-top:16px;overflow:hidden}
.dbar>i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .5s ease}
.dbarTxt{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx-3);margin-top:8px}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:18px;position:sticky;top:0;z-index:20;background:rgba(246,247,249,.92);backdrop-filter:blur(12px);
  padding:10px 0 0;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:0 0 10px;font-size:13.5px;color:var(--tx-3);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--tx);border-bottom-color:var(--tx)}
.tab:active{color:var(--tx-2)}

/* ---------- generic ---------- */
section.view{display:none;padding-top:18px}
section.view.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:var(--gap);box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:14px;color:var(--tx);display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:-.01em}
.card h3 .sub{font-size:11.5px;color:var(--tx-3);font-weight:500;margin-left:auto;text-align:right}
.muted{color:var(--tx-3)}
.small{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--tx-2);background:var(--surface)}
.chip.math{color:var(--math);border-color:#dbe6ff;background:var(--math-wash)}
.chip.cs{color:var(--cs);border-color:#fde8cf;background:var(--cs-wash)}
.chip.en{color:var(--en);border-color:#d1fae5;background:var(--en-wash)}
.chip.rev{color:var(--rev);border-color:#e9e3ff;background:var(--rev-wash)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pill{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--tx-3)}

/* day intro */
.dayhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.dayhead .d1{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.dayhead .d2{font-size:12px;color:var(--tx-2);line-height:1.4}
.dayhead .d3{margin-left:auto;text-align:right}
.stepper{display:flex;gap:6px;justify-content:flex-end}
.stepper button{min-width:34px;height:32px;padding:0 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line-2);font-size:13px;font-weight:600;color:var(--tx-2)}
.stepper button:disabled{opacity:.4}
.phasebar{display:flex;gap:6px;margin:2px 0 16px}
.phasebar div{flex:1;height:4px;border-radius:9px;background:#eceef2;overflow:hidden}
.phasebar i{display:block;height:100%;background:var(--blue)}

/* focus card */
.focus{border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line);position:relative;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.focus.math{background:linear-gradient(135deg,var(--math-wash),#fff 72%);border-color:#dbe6ff}
.focus.cs{background:linear-gradient(135deg,var(--cs-wash),#fff 72%);border-color:#fde8cf}
.focus.rev{background:linear-gradient(135deg,var(--rev-wash),#fff 72%);border-color:#e9e3ff}
.focus .k{font-size:11px;letter-spacing:.08em;color:var(--tx-3);font-weight:600;text-transform:uppercase}
.focus .t{font-size:19px;font-weight:700;margin:5px 0 3px;letter-spacing:-.02em}
.focus .s{font-size:12.5px;color:var(--tx-2)}
.focus .go{display:inline-block;margin-top:10px;font-size:11.5px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);color:var(--tx-2);font-weight:600}

/* blocks */
.block{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:8px;overflow:hidden;background:var(--surface)}
.block.done{opacity:.62}
.block.now{border-color:#c7d7fb;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.block.open>header{border-bottom:1px solid var(--line)}
.block>header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.time{font-family:var(--mono);font-size:11px;color:var(--tx-3);min-width:84px;letter-spacing:-.02em}
.block .name{font-size:13.5px;font-weight:600;flex:1;min-width:0;letter-spacing:-.01em}
.block .dur{font-size:11px;color:var(--tx-3);font-family:var(--mono)}
.caret{font-size:10px;color:var(--tx-3);transition:transform .2s}
.block.open .caret{transform:rotate(90deg)}
.block .body{display:none;padding:2px 14px 12px}
.block.open .body{display:block}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task label{display:flex;gap:10px;align-items:flex-start;flex:1;font-size:13px;color:var(--tx-2);cursor:pointer;line-height:1.5}
.task.done label{color:var(--tx-3);text-decoration:line-through}
.task.pending{background:var(--blue-wash);border-radius:9px;padding-left:8px;padding-right:8px;margin-top:2px}
.task.pending label{color:var(--tx);font-weight:500}
.task.pending .cb{border-color:var(--blue)}
.cb{flex:0 0 19px;width:19px;height:19px;border-radius:5px;border:1.5px solid #d1d5db;margin-top:1px;position:relative;transition:.15s;background:var(--surface)}
.task.done .cb{background:var(--blue);border-color:var(--blue)}
.task.done .cb::after{content:"";position:absolute;left:6px;top:2px;width:4.5px;height:9.5px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
.tag{font-size:10.5px;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--tx-3);margin-left:4px;white-space:nowrap}

/* progress strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 11px}
.kpi b{display:block;font-family:var(--mono);font-size:18px;font-weight:700;letter-spacing:-.03em;color:var(--tx)}
.kpi span{font-size:10.5px;color:var(--tx-3)}
.kpi.math b{color:var(--math)} .kpi.cs b{color:var(--cs)} .kpi.en b{color:var(--en)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:10px;color:var(--tx-3);text-align:center;padding-bottom:3px}
.cell{aspect-ratio:1/1.1;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:4px 4px 3px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.cell .d{font-size:9.5px;color:var(--tx-3);font-family:var(--mono)}
.cell .dot{font-size:8.5px;font-weight:600;line-height:1.15;color:var(--tx-2);word-break:break-all}
.cell.math{border-color:#dbe6ff;background:var(--math-wash)}
.cell.cs{border-color:#fde8cf;background:var(--cs-wash)}
.cell.mock{border-color:#e9e3ff;background:var(--rev-wash)}
.cell.rev{background:var(--surface-2)}
.cell .fill{position:absolute;left:0;bottom:0;width:100%;background:rgba(37,99,235,.13);pointer-events:none}
.cell.today{outline:2px solid var(--tx);outline-offset:-1px}
.cell.past{opacity:.78}
.cell .mk{position:absolute;right:3px;top:2px;font-size:9px;color:var(--cs);font-weight:700}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--tx-2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* tables / lists */
.exam{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.exam:first-child{border-top:0}
.exam .no{font-family:var(--mono);font-size:11px;color:var(--tx-3);width:44px;flex:0 0 auto}
.exam .tt{flex:1;min-width:0}
.exam .tt b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.exam .tt span{font-size:11px;color:var(--tx-3)}
.exam .acts{display:flex;gap:6px;align-items:center}
.mini{font-size:11.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line-2);color:var(--tx-2);background:var(--surface);font-weight:500}
.mini.on{background:var(--blue-wash);border-color:#c7d7fb;color:var(--blue-ink)}
.mini.rev.on{background:var(--en-wash);border-color:#d1fae5;color:#047857}
.exam.hidden{display:none}
.subjtitle{display:flex;align-items:center;gap:8px;margin:18px 0 2px;font-size:13px;font-weight:650;letter-spacing:-.01em}
.subjtitle .ln{flex:1;height:1px;background:var(--line)}

/* ring */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ring{text-align:center;position:relative}
.ring svg{width:100%;max-width:92px;height:auto;display:block;margin:0 auto}
.ring .v{font-family:var(--mono);font-size:14px;font-weight:700;position:absolute;top:0;left:0;right:0;height:92px;
  display:flex;align-items:center;justify-content:center;letter-spacing:-.02em}
.ring .l{font-size:11px;color:var(--tx-3);margin-top:4px}

/* weekly bars */
.wk{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:11.5px;color:var(--tx-2)}
.wk .lbl{width:64px;color:var(--tx-3)}
.wk .bar{flex:1;height:7px;border-radius:9px;background:#eef0f4;overflow:hidden}
.wk .bar i{display:block;height:100%;background:var(--blue);border-radius:9px}
.wk .pct{width:38px;text-align:right;font-family:var(--mono);color:var(--tx-3)}

/* review tab */
.mistake{border-left:3px solid var(--line-2);padding:8px 0 8px 12px;margin:8px 0;background:var(--surface-2);border-radius:0 10px 10px 0}
.mistake b{font-size:13px;font-weight:600}
.mistake p{margin:2px 0;font-size:12px;color:var(--tx-2);white-space:pre-wrap}
.mistake .row{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.inp{background:var(--surface);border:1px solid var(--line-2);color:var(--tx);border-radius:10px;padding:9px 11px;font-size:13px;font-family:inherit;width:100%}
.inp:focus{outline:none;border-color:#b6c8f5;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
textarea.inp{resize:vertical;min-height:68px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:var(--blue);color:#fff;font-weight:600;font-size:13px;padding:10px 15px;border-radius:10px;letter-spacing:-.01em}
.btn:active{opacity:.86}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--tx-2)}
.btn.sm{font-size:12px;padding:7px 11px;border-radius:8px}
.btn.danger{background:var(--red-wash);border:1px solid #fecaca;color:var(--red)}
.empty{text-align:center;color:var(--tx-3);font-size:12.5px;padding:26px 10px}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:7px 4px calc(7px + var(--safe-b));display:flex;max-width:720px;margin:0 auto}
nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:10px;color:var(--tx-3);font-weight:600}
nav.bottom button .ic{font-size:17px;line-height:1}
nav.bottom button.on{color:var(--tx)}
/* 中间打卡按钮 */
nav.bottom .checkinBtn{position:relative;flex:1.25;padding-top:2px}
nav.bottom .ckCircle{width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px -6px rgba(37,99,235,.65),0 2px 6px rgba(37,99,235,.25);border:3px solid #fff;margin-top:-16px;transition:transform .12s}
nav.bottom .checkinBtn:active .ckCircle{transform:scale(.94)}
nav.bottom .ckLbl{font-size:10px;color:var(--blue);font-weight:700;margin-top:1px}
nav.bottom .ckBadge{position:absolute;top:-14px;right:calc(50% - 34px);min-width:19px;height:19px;padding:0 5px;border-radius:99px;
  background:#ef4444;color:#fff;font-size:10.5px;font-weight:700;line-height:19px;text-align:center;box-shadow:0 0 0 2px #fff}
nav.bottom .ckBadge.zero{display:none}

/* sheet */
.mask{position:fixed;inset:0;background:rgba(17,24,39,.32);z-index:40;display:none;backdrop-filter:blur(2px)}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  max-height:88vh;overflow:auto;padding:8px 18px calc(22px + var(--safe-b));transform:translateY(102%);transition:transform .26s ease;max-width:720px;margin:0 auto;box-shadow:0 -12px 40px -20px rgba(16,24,40,.25)}
.sheet.on{transform:none}
.grab{width:42px;height:4px;border-radius:9px;background:#e5e7eb;margin:6px auto 14px}
.sheet h3{margin:0 0 6px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.sheet .hint{font-size:12px;color:var(--tx-3);margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--tx-2);margin-bottom:6px;font-weight:500}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,14px);background:var(--tx);border:1px solid var(--tx);color:#fff;
  padding:9px 16px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:.22s;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.note{font-size:12px;color:var(--tx-3);line-height:1.7}
.note b{color:var(--tx-2)}

/* ---------- 日程编辑 ---------- */
.editDay{display:block;margin-top:7px;font-size:11.5px;padding:6px 10px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--tx-2);font-weight:600}
.block .mini[data-editb]{padding:2px 7px;font-size:11px;color:var(--tx-3);background:var(--surface);border:1px solid var(--line)}
.block .mini[data-editb]:active{background:var(--surface-2)}
.eb{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface);overflow:hidden}
.eb.open{border-color:#c7d7fb;box-shadow:0 0 0 3px rgba(37,99,235,.06)}
.ehead{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer}
.eb.open .ehead{background:var(--blue-wash)}
.etime{font-family:var(--mono);font-size:11px;color:var(--tx-2);min-width:84px}
.ename{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emins{font-size:10.5px;color:var(--tx-3);font-family:var(--mono)}
.eb .caret{font-size:10px;color:var(--tx-3);transition:transform .2s}
.eb.open .caret{transform:rotate(90deg)}
.ebody{display:none;padding:12px;border-top:1px solid var(--line)}
.eb.open .ebody{display:block}
.ebody label{display:block;font-size:11.5px;color:var(--tx-3);margin-bottom:4px}
.ebody .inp{font-size:14px!important;padding:8px 10px}
.ebody .row2{gap:8px}
.trow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.trow .inp{flex:1;min-width:0}
.ebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

/* 各科投入 */
.mods .sub{color:var(--tx-3)}
.modsum{margin-top:2px}
.modrow{display:flex;align-items:center;gap:10px;margin:9px 0}
.modrow .mname{width:62px;flex:0 0 auto;font-size:12px;font-weight:600}
.modrow .mbar{flex:1;height:8px;border-radius:9px;background:#eef0f4;overflow:hidden}
.modrow .mbar i{display:block;height:100%;border-radius:9px;transition:width .4s}
.modrow .mval{width:74px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--tx-2);flex:0 0 auto}
.casc{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-top:6px;font-size:12.5px;color:var(--tx-2)}
.casc label{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--tx);margin-bottom:5px}
.casc input[type=checkbox]{width:17px;height:17px;accent-color:var(--blue)}
@media(max-width:360px){.count .num{font-size:50px}.strip{grid-template-columns:repeat(2,1fr)}nav.tabs{gap:16px}}
/* ---------- 打卡面板 ---------- */
.ckHero{display:flex;align-items:center;gap:16px;margin:2px 0 16px}
.ckRing{position:relative;width:76px;height:76px;flex:0 0 auto}
.ckRing svg{display:block;width:76px;height:76px}
.ckRing .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:-.03em}
.ckMeta{flex:1;min-width:0}
.ckMeta .big{font-size:16px;font-weight:650;letter-spacing:-.02em}
.ckMeta .sub{font-size:12px;color:var(--tx-3);margin-top:2px}
.ckQuickBtn{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:14px;
  background:var(--blue-wash);border:1px solid #dbe6ff;margin-bottom:14px}

(function () {
'use strict';

const WD = ['日', '一', '二', '三', '四', '五', '六'];

const $ = (s, r) => (r || document).querySelector(s);

const pad = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function ymd(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
function diffDays(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }
function md(s) { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; }
function wd(s) { return WD[parse(s).getDay()]; }
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

/* 日期可在设置里改；未改时用默认 11/1–12/18 / 12/19 */

/* ---------- 每日任务生成 ---------- */

function buildBlocks(date) {

      tasks: (b.tasks || []).map(t => Object.assign({}, t)),
    }));
    if (ct.length) {

}

/* ---------- 时间计算 ---------- */
function toMin(hm) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hm || '').trim());
  if (!m) return null;
  return Number(m[1]) * 60 + Number(m[2]);
}
function blockMin(b) {
  const a = toMin(b.from), z = toMin(b.to);
  if (a === null || z === null || z <= a) return 0;
  return z - a;
}
const MEAL_IDS = ['b3', 'b5', 'b7', 'b10', 'b12', 'b15'];
function isMealBlock(b) {
  return MEAL_IDS.indexOf(b.id) >= 0 || /早餐|午餐|晚餐|午休|休息|放松|散步|洗漱/.test(b.name);
}

function modOf(b) {
  if (b.mod) return b.mod;
  if (b.tag === 'math' || b.tag === 'cs' || b.tag === 'en') return b.tag;
  return 'rev';
}
function modMinutes(date) {
  const out = { math: 0, en: 0, cs: 0, rev: 0 };
  (buildBlocks(date) || []).forEach(b => {
    const n = blockMin(b);
    if (n > 0) { const k = modOf(b); out[k] = (out[k] || 0) + n; }
  });
  return out;
}
function studyMinutes(date) {
  return (buildBlocks(date) || []).reduce((n, b) => n + (isMealBlock(b) ? 0 : blockMin(b)), 0);
}
function timeSpan(date) {
  const bs = buildBlocks(date) || [];
  let a = null, z = null;
  bs.forEach(b => {
    const x = toMin(b.from), y = toMin(b.to);
    if (x !== null && (a === null || x < a)) a = x;
    if (y !== null && (z === null || y > z)) z = y;
  });
  if (a === null || z === null || z <= a) return '';
  return fmtMin(z - a);
}
function fmtMin(n) {
  if (!n || n <= 0) return '0′';
  const h = Math.floor(n / 60), m = n % 60;
  return (h ? h + ' 小时' : '') + (m ? (h ? ' ' : '') + m + ' 分' : (h ? '' : '0 分'));
}
function nowMin() {
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}
function inBlock(b, n) {
  const a = toMin(b.from), z = toMin(b.to);
  if (a === null || z === null) return false;
  return n >= a && n < z;
}

/* ---------- 计算 ---------- */
/* 任务 id 只在“当天”内唯一，存库时按 日期|任务id 做 key，避免跨天串状态 */
function tkey(date, tid) { return date + '|' + tid; }
function taskState(date, tid) { const d = S.tasks[tkey(date, tid)]; return !!(d && d.done); }
function toggleTask(date, tid, blockTasks) {
  const k = tkey(date, tid);
  const cur = taskState(date, tid);
  S.tasks[k] = { done: !cur, at: Date.now() };
  const t = blockTasks.find(x => x.id === tid);
  if (t && t.ex) {
    S.exams[t.ex] = Object.assign({}, S.exams[t.ex], { done: !cur, date: !cur ? date : null });
  }
  if (t && t.rids) t.rids.forEach(id => { if (!cur) S.readings[id] = 1; else delete S.readings[id]; });
  if (t && t.nid) { if (!cur) S.newtypes[t.nid] = 1; else delete S.newtypes[t.nid]; }
  save();
  render();
}

function dayProgress(date) {
  const blocks = buildBlocks(date);
  let total = 0, done = 0;
  blocks.forEach(b => b.tasks.forEach(t => { total++; if (taskState(date, t.id)) done++; }));
  return { total, done, pct: total ? Math.round(done / total * 100) : 0, blocks };
}

function overall() {
  const total = EXAMS.length;
  const done = EXAMS.filter(e => S.exams[e.id] && S.exams[e.id].done).length;
  const m = EXAMS.filter(e => e.subject === 'math');
  const c = EXAMS.filter(e => e.subject === 'cs');
  return {
    total, done, pct: Math.round(done / total * 100),
    math: { done: m.filter(e => S.exams[e.id] && S.exams[e.id].done).length, total: m.length },
    cs: { done: c.filter(e => S.exams[e.id] && S.exams[e.id].done).length, total: c.length },
  };
}

function streak() {
  // 从今天往前数连续“有完成项”的天数；今天还没开始则从昨天算
  let end = idxOf(todayKey());
  if (end < 0) return 0;
  const td = DAYS[end];
  if (dayProgress(td).done === 0) end -= 1;
  let n = 0;
  for (let i = end; i >= 0; i--) {
    if (dayProgress(DAYS[i]).done === 0) break;
    n++;
  }
  return n;
}

function cascEnabled() { return !S.settings || S.settings.cascade !== false; }
function hhmmOf(m) {

/* 把第 bi 块之后的块整体顺延，保持各自原有时长（开关关掉时不生效） */
function applyCascade(bi) {

  if (!cur) return;
  const a = toMin(cur.from), z = toMin(cur.to);
  if (a === null || z === null || z < a) return;
  if (toMin(cur.to) === 1440) cur.to = '24:00';
  let end = z;
  for (let j = bi + 1; j < ED.blocks.length; j++) {
    const b = ED.blocks[j];
    const dur = blockMin(b) || 30;
    b.from = hhmmOf(end);
    b.to = hhmmOf(end + dur);
    end = end + dur;
  }
  syncEditorTimes();
}
/* 顺延后回填输入框，避免整体重绘导致失焦 */
function syncEditorTimes() {
  $$('#sheet .ed').forEach(el => {
    const bi = Number(el.dataset.b), f = el.dataset.f;
    if (f !== 'from' && f !== 'to') return;
    if (!ED.blocks[bi]) return;
    const val = ED.blocks[bi][f];
    if (el.value !== val) el.value = val;
  });
  $$('#sheet .eb').forEach((el, bi) => {
    const b = ED.blocks[bi];
    if (!b) return;
    const t = el.querySelector('.etime');
    if (t) t.textContent = b.from + '–' + b.to;
    const m = el.querySelector('.emins');
    if (m) m.textContent = blockMin(b) ? fmtMin(blockMin(b)) : '—';
  });
}

function saveDayEditor(applyAll) {
  const date = ED.date;
  const clean = [];
  ED.blocks.forEach(b => {
    const a = toMin(b.from), z = toMin(b.to);
    if (a === null || z === null || z <= a) return;
    const tasks = (b.tasks || []).filter(t => String(t.text || '').trim()).map((t, k) => ({
      id: t.id || ('t' + Date.now().toString(36) + k),
      text: String(t.text).trim(),
      ex: t.ex, rids: t.rids, nid: t.nid, custom: t.custom,
    }));
    clean.push({
      id: b.id, tag: b.tag || 'rev', mod: b.mod || modOf(b), from: b.from, to: b.to,
      name: String(b.name || '未命名').trim() || '未命名',
      sub: String(b.sub || '').trim(), tasks: tasks,
    });
  });
  clean.sort((x, y) => (toMin(x.from) || 0) - (toMin(y.from) || 0));
  if (!clean.length) { toast('至少留一个有效时间块（结束要晚于开始）'); return; }

  if (applyAll) {
    const all = DAYS.filter(d => d >= date);
    const editedDays = all.filter(d => S.days[d] && S.days[d].note);
    const freeDays = all.filter(d => !(S.days[d] && S.days[d].note));
    let target = freeDays;
    if (editedDays.length) {
      const ok = confirm('有 ' + editedDays.length + ' 天你已经单独改过。\n\n确定 = 连这些天也一起覆盖（只换时间结构，任务按各自那天重新生成）\n取消 = 只套用到还没改过的 ' + freeDays.length + ' 天');
      if (ok) target = all;
    }
    const dayNote = (S.custom[date] && S.custom[date].note) || '';
    target.forEach(d => {
      S.days[d] = {
        note: true,
        blocks: clean.map(b => ({
          id: b.id, tag: b.tag, mod: b.mod, from: b.from, to: b.to, name: b.name, sub: b.sub,
          tasks: applyTasksFor(d, b, d === date ? dayNote : ''),
        })),
      };
    });
    save(); closeSheet(); render();
    toast('时间结构已套用到 ' + target.length + ' 天');
    return;
  }

  const dayNote = (S.custom[date] && S.custom[date].note) || '';
  S.days[date] = { note: true, blocks: clean.map(b => ({ id: b.id, tag: b.tag, mod: b.mod, from: b.from, to: b.to, name: b.name, sub: b.sub, tasks: applyTasksFor(date, b, dayNote) })) };
  save(); closeSheet(); render();
  toast('这天的日程已保存');
}

/* 保留时间骨架，任务按“那一天”重新生成；餐/休息/自定义沿用，你自己加的新任务保留 */
function applyTasksFor(date, tplBlock, dayNote) {
  const own = defaultBlocks(date, false);
  // 优先按 id 找同块；找不到就按“科目 + 名字关键词”找最接近的那块
  const mod = tplBlock.mod || 'rev';
  let hit = own.find(b => b.id === tplBlock.id);
  if (!hit) {
    const pool = own.filter(b => (b.mod || 'rev') === mod && !isMealBlock(b));
    hit = pool.find(b => b.name && tplBlock.name && (b.name.indexOf(tplBlock.name) >= 0 || tplBlock.name.indexOf(b.name) >= 0)) || pool[0];
  }
  const ownTasks = hit ? hit.tasks : [];
  const tplTasks = tplBlock.tasks || [];
  const merged = [], seen = {};
  const push = t => { if (!seen[t.id]) { seen[t.id] = 1; merged.push(Object.assign({}, t)); } };
  // 1) 那天自己的任务（套卷/阅读/专题……保证内容对得上）
  if (ownTasks.length) ownTasks.forEach(push);
  // 2) 餐/休息沿用模板里的（可能被你改过文案）
  tplTasks.filter(t => /^(meal|rest)/.test(t.id)).forEach(push);
  // 3) 你自己加的新任务
  tplTasks.filter(t => /^t/.test(t.id)).forEach(push);
  // 4) “今日内容”只留在被编辑的那一天
  if (dayNote) push({ id: 'x-note', text: '今日内容：' + dayNote });
  // 5) 那天没有对应内容时，保留模板任务，至少不丢
  if (!merged.length) return tplTasks.map(t => Object.assign({}, t));
  return merged;
}

/* ---------- 打卡面板（主功能） ---------- */
function todayTasks(date) {
  const bs = buildBlocks(date) || [];
  const out = [];
  bs.forEach(b => {
    (b.tasks || []).forEach(t => out.push({ b: b, t: t }));
  });
  return out;
}
function checkinStats(date) {
  const all = todayTasks(date);
  const done = all.filter(x => taskState(date, x.t.id)).length;
  return { done: done, total: all.length, pct: all.length ? Math.round(done / all.length * 100) : 0 };
}
function updateCheckinBadge() {
  const el = $('#ckBadge');
  if (!el) return;
  const c = checkinStats(CUR);
  const left = c.total - c.done;
  el.textContent = left > 99 ? '99+' : String(left);
  el.classList.toggle('zero', left <= 0);
}
function ckRing(pct, size, stroke, color) {
  const r = (size - stroke) / 2 - 1;
  const c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(1, pct / 100)));
  return `<svg viewBox="0 0 ${size} ${size}">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#e8f0ff" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
  </svg>`;
}

function openCheckin() {

      </div>

    <div class="ckAll">

/* ---------- 渲染：日历 ---------- */
function renderCalendar() {
  const ov = overall();
  const today = todayKey();

  // 7 列网格：从 11/1（周日）开始，正好是周日
  const cells = [];
  const firstWd = parse(START).getDay();
  for (let k = 0; k < firstWd; k++) cells.push('<div></div>');
  DAYS.forEach((d, i) => {
    const ex = examOn(d);
    const p = dayProgress(d);
    const isPast = d < today;
    let cls = 'cell';
    if (ex.some(e => e.kind === 'mock')) cls += ' mock';
    else if (ex.length) cls += ' ' + ex[0].subject;
    else cls += ' rev';
    if (isPast) cls += ' past';
    if (d === today) cls += ' today';
    // 完成度决定底部填充高度
    const fillH = Math.round(p.pct * 0.9);
    // 今天/过去的日子有未打卡的套卷 → 右上角 “!”
    const miss = d <= today && ex.some(e => !(S.exams[e.id] && S.exams[e.id].done));
    let tag = '';
    if (ex.length) {
      const e = ex[0];
      tag = e.kind === 'mock' ? '模拟' : (e.subject === 'math' ? String(e.year).slice(2) + '·数' : String(e.year).slice(2) + '·408');
    }
    cells.push(`<div class="${cls}" data-cal="${d}" title="${d} · 完成 ${p.pct}%">
      <div class="d">${parse(d).getDate()}</div>
      <div class="dot">${tag}</div>
      ${p.pct > 0 ? `<div class="fill" style="height:${fillH}%"></div>` : ''}
      ${miss ? '<div class="mk">!</div>' : ''}
    </div>`);
  });

  const wdHead = ['日', '一', '二', '三', '四', '五', '六'].map(w => `<div class="wd">${w}</div>`).join('');

  // 每周完成度
  const weeks = [];
  for (let w = 0; w < 7; w++) {
    const ds = DAYS.slice(w * 7, w * 7 + 7);
    if (!ds.length) continue;
    let t = 0, dn = 0;
    ds.forEach(d => { const p = dayProgress(d); t += p.total; dn += p.done; });
    weeks.push({ w, label: md(ds[0]) + '–' + md(ds[ds.length - 1]), dn, t, pct: t ? Math.round(dn / t * 100) : 0 });
  }

  // 48 天各科累计投入（含今天已过的那部分）
  const sumMod = { math: 0, en: 0, cs: 0, rev: 0 };
  DAYS.forEach(d => { const m = modMinutes(d); MODS.forEach(x => { sumMod[x.id] += m[x.id] || 0; }); });
  const sumTotal = MODS.reduce((a, x) => a + sumMod[x.id], 0);
  const modColor = { math: 'var(--math)', en: 'var(--en)', cs: 'var(--cs)', rev: '#7c3aed' };
  const sumCard = `
    <div class="card mods">
      <h3>48 天各科累计 <span class="sub">合计 ${Math.round(sumTotal / 60)} 小时</span></h3>
      ${MODS.map(m => {
        const v = sumMod[m.id];
        const pct = sumTotal ? Math.round(v / sumTotal * 100) : 0;
        return `<div class="modrow">
          <span class="mname" style="color:${modColor[m.id]}">${m.name}</span>
          <div class="mbar"><i style="width:${pct}%;background:${modColor[m.id]}"></i></div>
          <span class="mval">${Math.round(v / 60)}h</span>
        </div>`;
      }).join('')}
      <div class="small muted" style="margin-top:8px">按当前日程估算（每天改时间/改科目后这里同步变）。三科合计约 ${Math.round((sumMod.math + sumMod.en + sumMod.cs) / 60)} 小时。</div>
    </div>`;

  $('#view-calendar').innerHTML = `
    <div class="card">
      <h3>48 天总览 <span class="sub">点格子跳到那一天</span></h3>
      <div class="cal">${wdHead}${cells.join('')}</div>
      <div class="legend" style="margin-top:10px">
        <span><i style="background:#2563eb"></i>数学卷</span>
        <span><i style="background:#d97706"></i>408 卷</span>
        <span><i style="background:#7c3aed"></i>模拟</span>
        <span><i style="background:#9ca3af"></i>复盘/缓冲</span>
        <span style="color:var(--tx-3)">底部高度＝当天完成度</span>
      </div>
    </div>

    ${sumCard}

    <div class="card">
      <h3>套卷消耗曲线 <span class="sub">理想 vs 实际</span></h3>
      ${burndownSvg(ov)}
      <div class="legend"><span><i style="background:#2563eb"></i>按计划剩余</span><span><i style="background:#059669"></i>实际剩余</span></div>
    </div>

    <div class="card">
      <h3>三科完成度</h3>
      <div class="rings">
        ${ring(ov.math.done, ov.math.total, '#2563eb', '数学 18 场')}
        ${ring(ov.cs.done, ov.cs.total, '#d97706', '408 20 场')}
        ${ring(Object.keys(S.readings).length, 40, '#059669', '阅读 40 篇')}
      </div>
    </div>

    <div class="card">
      <h3>每周完成度</h3>
      ${weeks.map(w => `<div class="wk"><span class="lbl">第${w.w + 1}周</span><div class="bar"><i style="width:${w.pct}%"></i></div><span class="pct">${w.pct}%</span></div>`).join('')}
    </div>`;

  $$('#view-calendar [data-cal]').forEach(el => el.addEventListener('click', () => {
    CUR = el.dataset.cal; switchView('today');
  }));
}

function ring(done, total, color, label) {
  const pct = total ? done / total : 0;
  const r = 34, c = 2 * Math.PI * r, off = c * (1 - pct);
  return `<div class="ring">
    <svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="#eef0f4" stroke-width="7"/>
    <circle cx="42" cy="42" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 42 42)"/></svg>
    <div class="v">${done}/${total}</div><div class="l">${label}</div>
  </div>`;
}

function burndownSvg(ov) {
  const W = 560, H = 150, padL = 26, padR = 8, padT = 10, padB = 18;
  const total = ov.total;
  const x = i => padL + i * (W - padL - padR) / 47;
  const y = v => padT + (1 - v / total) * (H - padT - padB);
  const ideal = DAYS.map((d, i) => `${x(i)},${y(total - total * i / 47)}`).join(' ');
  // 实际：按日期统计已完成的套卷（用打卡时间）
  const pts = [];
  let doneCum = 0;
  DAYS.forEach((d, i) => {
    doneCum = EXAMS.filter(e => S.exams[e.id] && S.exams[e.id].done && String(S.exams[e.id].date || '') <= d).length;
    pts.push(`${x(i)},${y(Math.max(0, total - doneCum))}`);
  });
  const lastIdx = clamp(idxOf(todayKey()), 0, 47);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#e5e7eb"/>
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="#e5e7eb"/>
    <polyline points="${ideal}" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
    <polyline points="${pts.slice(0, lastIdx + 1).join(' ')}" fill="none" stroke="#059669" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="${x(lastIdx)}" cy="${y(Math.max(0, total - EXAMS.filter(e => S.exams[e.id] && S.exams[e.id].done).length))}" r="3.5" fill="#059669"/>
    <text x="${padL}" y="${H - 5}" fill="#9ca3af" font-size="9">11/1</text>
    <text x="${W - padR}" y="${H - 5}" fill="#9ca3af" font-size="9" text-anchor="end">12/18</text>
    <text x="${padL + 2}" y="${padT + 9}" fill="#9ca3af" font-size="9">剩 ${total}</text>
    <text x="${padL + 2}" y="${H - padB - 4}" fill="#9ca3af" font-size="9">0</text>
  </svg>`;
}

/* ---------- 渲染：复盘 ---------- */
function renderReview() {
  const list = (S.mistakes || []).slice().sort((a, b) => (b.next || '').localeCompare(a.next || ''));
  const due = list.filter(m => m.next && m.next <= todayKey() && !m.reviewed);
  const html = `
    <div class="card">
      <h3>错题卡片 <span class="sub">按日期间隔复习：1 → 3 → 7 → 15 天</span></h3>
      ${due.length ? `<div class="small" style="color:#b45309;margin-bottom:8px">今天有 ${due.length} 张到期，先过一遍再去开新卷。</div>` : `<div class="small muted" style="margin-bottom:8px">今天没有到期卡片。继续按计划推进即可。</div>`}
      <button class="btn sm" id="newMistake">+ 记一道错题</button>
    </div>
    ${list.length ? list.map(m => `
      <div class="card" style="padding:14px 16px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="chip ${m.subject === 'math' ? 'math' : m.subject === 'cs' ? 'cs' : 'en'}">${SUBJ[m.subject] || m.subject}</span>
          <span class="small muted">${m.date || ''}</span>
          <span class="pill" style="margin-left:auto">${m.reviewed ? '已消化' : (m.next ? '下次 ' + m.next : '')}</span>
        </div>
        <b style="font-size:13.5px">${esc(m.title)}</b>
        ${m.reason ? `<p style="margin:4px 0 0;font-size:12.5px;color:var(--tx-2)">错因：${esc(m.reason)}</p>` : ''}
        ${m.fix ? `<p style="margin:2px 0 0;font-size:12.5px;color:var(--tx-2)">正解/方法：${esc(m.fix)}</p>` : ''}
        <div class="row" style="display:flex;gap:8px;margin-top:10px">
          <button class="mini ${m.reviewed ? 'on' : ''}" data-mrev="${m.id}">${m.reviewed ? '已消化 ✓' : '再消化一次'}</button>
          <button class="mini" data-mdel="${m.id}" style="color:#dc2626">删除</button>
        </div>
      </div>`).join('') : `<div class="empty">还没有错题卡片。<br>做完第一套卷，把最典型的 3 道记进来就够了。</div>`}`;
  $('#view-review').innerHTML = html;

  $('#newMistake').addEventListener('click', () => openMistakeSheet(todayKey()));
  $$('#view-review [data-mrev]').forEach(el => el.addEventListener('click', () => {
    const m = S.mistakes.find(x => x.id === el.dataset.mrev);
    if (!m) return;
    m.reviewed = !m.reviewed;
    m.reviewCount = (m.reviewCount || 0) + 1;
    m.next = m.reviewed ? null : addDays(todayKey(), [1, 3, 7, 15, 30][Math.min(4, m.reviewCount)]);
    save(); renderReview();
  }));
  $$('#view-review [data-mdel]').forEach(el => el.addEventListener('click', () => {
    S.mistakes = S.mistakes.filter(x => x.id !== el.dataset.mdel);
    save(); renderReview(); toast('已删除');
  }));
}

function openMistakeSheet(date) {
  openSheet(`
    <h3>记一道错题</h3>
    <div class="hint">只记“会做但做错”和“完全没思路”的题，一道题一行字。</div>
    <div class="field"><label>科目</label>
      <select class="inp" id="mSubj"><option value="math">数学一</option><option value="cs">408</option><option value="en">英语一</option></select></div>
    <div class="field"><label>题目（哪年哪题，一句话）</label>
      <input class="inp" id="mTitle" placeholder="如 2015 数一 T19：级数求和漏了端点"></div>
    <div class="field"><label>错因</label>
      <input class="inp" id="mReason" placeholder="如 计算错/概念错/没思路/审题错"></div>
    <div class="field"><label>正确方法（1–2 行）</label>
      <textarea class="inp" id="mFix" placeholder="下次遇到先做什么？"></textarea></div>
    <button class="btn" id="mSave" style="width:100%">保存</button>
  `);
  $('#mSave').addEventListener('click', () => {
    const t = $('#mTitle').value.trim();
    if (!t) { toast('先写题目标题'); return; }
    S.mistakes.push({
      id: 'x' + Date.now(), date: date, subject: $('#mSubj').value,
      title: t, reason: $('#mReason').value.trim(), fix: $('#mFix').value.trim(),
      next: addDays(todayKey(), 1), reviewed: false, reviewCount: 0,
    });
    save(); closeSheet(); render();
    toast('已加入错题卡片');
  });
}

/* ---------- 设置 ---------- */
function openSettings() {
  openSheet(`
    <h3>设置与数据</h3>
    <div class="hint">这个页面不联网、不上传，所有记录只保存在当前浏览器。</div>
    <div class="note" style="background:#f2f4f7;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:14px">
      <b>想改每天的作息？</b>回「今日」页，点日期右边的 <b>✎ 改这天的日程</b>：每块的起止时间、标题、任务都能改，也能加块/删块；改完可「套用到后面所有天」。
    </div>
    <div class="field"><label>初试日期</label>
      <input class="inp" id="setExam" type="date" value="${EXAM}"></div>
    <div class="field"><label>计划开始 / 结束</label>
      <div class="row2"><input class="inp" id="setStart" type="date" value="${START}"><input class="inp" id="setEnd" type="date" value="${END}"></div></div>
    <button class="btn ghost sm" id="setSave" style="margin-bottom:14px">保存日期（刷新后生效）</button>
    <hr class="sep">
    <div class="field"><label>备份 / 换手机</label>
      <div class="row2">
        <button class="btn ghost sm" id="expBtn">导出 JSON</button>
        <button class="btn ghost sm" id="impBtn">导入 JSON</button>
      </div>
      <input type="file" id="impFile" accept="application/json,.json" style="display:none">
      <div class="small muted" style="margin-top:8px">换手机：旧手机导出 → 把文件发给自己 → 新手机打开本页 → 导入。</div>
    </div>
    <hr class="sep">
    <div class="field"><label>清空全部数据</label>
      <button class="btn danger sm" id="resetBtn">清空（不可恢复）</button></div>
    <hr class="sep">
    <div class="note">
      <b>手机使用建议</b><br>
      1. 把本页加到主屏幕：iOS Safari「分享 → 添加到主屏幕」，Android Chrome「⋮ → 添加到主屏幕」。<br>
      2. 用 file:// 打开也能用，但部分浏览器会清 localStorage；想稳一点就用免费的静态托管（见使用说明）。<br>
      3. 每次大调整前先「导出 JSON」，这是唯一可靠的备份。
    </div>
  `);
  $('#setSave').addEventListener('click', () => {
    const o = { exam: $('#setExam').value, start: $('#setStart').value, end: $('#setEnd').value };
    if (!o.exam || !o.start || !o.end) { toast('日期不能为空'); return; }
    S.settings = o; save();
    toast('已保存，3 秒后自动刷新');
    setTimeout(() => location.reload(), 1200);
  });
  $('#expBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kaoyan48-' + ymd(new Date()) + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast('已导出，请保存到网盘/微信文件传输助手');
  });
  $('#impBtn').addEventListener('click', () => $('#impFile').click());
  $('#impFile').addEventListener('change', ev => {
    const f = ev.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        if (!o || typeof o !== 'object') throw 0;
        S = Object.assign(freshState(), o, {
          days: o.days || {}, custom: o.custom || {}, hours: o.hours || {}, exams: o.exams || {},
          tasks: o.tasks || {}, readings: Object.assign({}, PRESET_READ, o.readings || {}),
          newtypes: o.newtypes || {}, ds: o.ds || {}, mistakes: o.mistakes || [],
        });
        save(); closeSheet(); render(); toast('导入成功');
      } catch (e) { toast('文件格式不对'); }
    };
    r.readAsText(f);
  });
  $('#resetBtn').addEventListener('click', () => {
    if (!confirm('确定清空所有打卡和复盘？建议先导出备份。')) return;
    S = JSON.parse(JSON.stringify(DEFAULT));
    save(); closeSheet(); render(); toast('已清空');
  });
}

/* ---------- UI 基础 ---------- */
let sheetOpen = false;
function openSheet(html) {
  const sh = $('#sheet');
  sh.innerHTML = `<div class="grab"></div>` + html;
  sh.classList.add('on'); $('#mask').classList.add('on'); sheetOpen = true;
}
function closeSheet() {
  $('#sheet').classList.remove('on'); $('#mask').classList.remove('on'); sheetOpen = false;
}
$('#mask').addEventListener('click', closeSheet);
$('#openSettings').addEventListener('click', openSettings);

let toastTimer = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
}

/* ---------- 视图切换 ---------- */
function switchView(v) {
  VIEW = v;
  $$('#tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $$('#bottomNav button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $$('.view').forEach(s => s.classList.toggle('on', s.id === 'view-' + v));
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
$$('#tabs .tab').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
$$('#bottomNav button').forEach(b => b.addEventListener('click', () => {
  if (b.id === 'checkinBtn') { openCheckin(); return; }
  switchView(b.dataset.view);
}));

/* ---------- header ---------- */
function renderHeader() {
  const today = new Date();
  const tk = ymd(today);
  const dExam = diffDays(tk, EXAM);
  const dStart = diffDays(tk, START);
  const inPlan = tk >= START && tk <= END;
  const dayNow = idxOf(tk) + 1;

  let num, unit, l1, l2;
  if (tk < START) {
    num = diffDays(tk, START); unit = '天';
    l1 = '距计划开始（11/1）';
    l2 = '开始后 48 天，到 12/18 收尾';
  } else if (dExam >= 0) {
    num = dExam; unit = '天';
    l1 = '距 2026-12-19 初试';
    l2 = inPlan ? `第 ${dayNow}/48 个学习日 · 今天不算还有 ${dExam - 1} 天` : '计划已结束';
  } else {
    num = Math.abs(dExam); unit = '天前';
    l1 = '初试已结束'; l2 = '';
  }
  $('#dNum').textContent = num;
  $('#dUnit').textContent = unit;
  $('#heroL1').textContent = l1;
  $('#heroL2').textContent = l2;

  const doneDays = inPlan ? clamp(dayNow, 0, 48) : (tk > END ? 48 : 0);
  $('#dbarFill').style.width = (doneDays / 48 * 100) + '%';
  const ov = overall();
  $('#dbarLeft').textContent = `已过 ${doneDays} / 48 天`;
  $('#dbarRight').textContent = `套卷 ${ov.done} / ${ov.total}`;
}

/* ---------- 主渲染 ---------- */
function render() {
  renderHeader();
  if (VIEW === 'today') renderToday();
  else if (VIEW === 'papers') renderPapers();
  else if (VIEW === 'skills') renderSkills();
  else if (VIEW === 'calendar') renderCalendar();
  else if (VIEW === 'review') renderReview();
  try { updateCheckinBadge(); } catch (e) {}
}

render();
})();
</script>
